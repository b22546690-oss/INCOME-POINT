        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); z-index: 50; display: none; justify-content: center; align-items: center; opacity: 0; transition: opacity 0.3s; }

        const dict = {

                    // Check if input is username (no @)
                    if (!input.includes('@')) {
                        const snap = await db.ref('users').orderByChild('username').equalTo(input).once('value');
                        if (!snap.exists()) throw "User not found";
                        const uid = Object.keys(snap.val())[0];
                        email = snap.val()[uid].email;
                    }
                    await auth.signInWithEmailAndPassword(email, pass);
                    ui.closeModal('auth-modal');
                } catch (err) {
                    ui.showError('auth-alert', "Invalid Credentials");
                } finally {
                    ui.loading(btn, false);
                }
            },

            register: async (e) => {
                e.preventDefault();
                const name = document.getElementById('reg-name').value;
                const user = document.getElementById('reg-username').value;
                const email = document.getElementById('reg-email').value;
                const pass = document.getElementById('reg-pass').value;
                const conf = document.getElementById('reg-confirm').value;
                const ref = document.getElementById('reg-ref').value;
                const btn = e.target.querySelector('button');

                if (pass !== conf) return ui.showError('auth-alert', "Passwords do not match");
                if (!name || !user || !email) return ui.showError('auth-alert', "Fill all fields");

                ui.loading(btn, true);

                try {
                    // Check Username uniqueness
                    const uSnap = await db.ref('users').orderByChild('username').equalTo(user).once('value');
                    if (uSnap.exists()) throw "Username taken";

                    const cred = await auth.createUserWithEmailAndPassword(email, pass);
                    
                    // Handle Referral
                    let referredBy = null;
                    if (ref) {
                        const rSnap = await db.ref('referralCodes').orderByValue().equalTo(ref).once('value');
                        if (rSnap.exists()) referredBy = Object.keys(rSnap.val())[0];
                    }

                    const newRefId = `U${Math.floor(100000 + Math.random() * 900000)}`;
                    const userData = {
                        username: user,
                        fullname: name,
                        email,
                        refId: newRefId,
                        referredBy,
                        isAccountActive: false,
                        balance: 0,
                        totalWithdraw: 0,
                        joinDate: new Date().toISOString()
                    };

                    await db.ref(`users/${cred.user.uid}`).set(userData);
                    await db.ref(`referralCodes/${cred.user.uid}`).set(newRefId);
                    if (referredBy) await db.ref(`users/${referredBy}/referrals/${cred.user.uid}`).set(true);

                    ui.closeModal('auth-modal');
                } catch (err) {
                    ui.showError('auth-alert', err.message || err);
                } finally {
                    ui.loading(btn, false);
                }
            }

        // Helper for btn loading

        // --- 4. APP LOGIC & ROUTING ---
        const app = {

            init: async () => {

                    authHandler.trigger();

                document.getElementById('sidebar-title').textContent = 'Cash BD';

                // Fail-closed admin gate: authenticated users must have an explicit
                // admin/users/{uid} allow-list entry before any admin UI is initialized.

                        state.user = null;

                        state.isAdmin = false;

                        app.nav('dashboard', true);
                        return;

                    try {
                        const adminSnap = await db.ref(`admin/users/${u.uid}`).once('value');
                        const adminValue = adminSnap.val();
                        const authorized = adminSnap.exists() && (adminValue === true || adminValue === 'true' || (adminValue && adminValue.role === 'admin' && adminValue.active !== false));
                        if (!authorized) {
                            state.user = null;
                            state.isGuest = true;
                            state.isAdmin = false;
                            await auth.signOut();
                            const root = document.getElementById('app') || document.body;
                            root.innerHTML = `<main class="min-h-screen flex items-center justify-center p-6"><section class="bg-white rounded-2xl shadow-xl p-8 max-w-md text-center"><div class="text-red-500 text-4xl mb-4"><i class="fas fa-shield-alt"></i></div><h1 class="text-xl font-bold text-gray-900">Admin access denied</h1><p class="text-sm text-gray-500 mt-2">This account is not authorized to access the administration panel.</p></section></main>`;
                            return;
                        }
                        state.user = u;
                        state.isGuest = false;
                        state.isAdmin = true;
                        // Load protected admin data only after the allow-list check succeeds.
                        const [taskS, planS, setS] = await Promise.all([
                            db.ref('tasks').once('value'),
                            db.ref('plans').once('value'),
                            db.ref('admin').once('value')
                        ]);
                        state.tasks = taskS.val() || {};
                        state.plans = planS.val() || {};
                        state.settings = setS.val() || { siteName: "Cash BD" };
                        document.getElementById('sidebar-title').textContent = state.settings.siteName || 'Cash BD';
                        document.title = state.settings.siteName || 'Cash BD';
                        const logoBox = document.getElementById('sidebar-logo');

                        db.ref(`users/${u.uid}`).on('value', snap => {
                            state.data = snap.val() || {};
                            app.updateUI();
                            app.nav(app.currentPage, true);
                        });
                        const adminLink = document.getElementById('admin-link');
                        if (adminLink) adminLink.classList.remove('hidden');
                    } catch (error) {
                        console.error('Admin authorization check failed', error);
                        await auth.signOut();
                        document.body.innerHTML = '<main class="min-h-screen flex items-center justify-center p-6"><p class="font-semibold text-red-600">Admin authorization could not be verified. Access is blocked.</p></main>';

                });

            updateUI: () => {

                ['sidebar', 'header'].forEach(p => {

            site_settings: () => {
                if (!state.isAdmin) return ui.authBlock();
                return `<div class="max-w-2xl mx-auto bg-white rounded-2xl border shadow-sm p-6 space-y-4"><h2 class="text-2xl font-extrabold">Site Settings</h2><p class="text-sm text-gray-500">Update site identity and payment receiving details.</p><label class="block text-sm font-semibold">Site Name</label><input id="site-name-input" class="w-full border rounded-xl p-3" value="${state.settings.siteName||'Cash BD'}"><label class="block text-sm font-semibold">Logo Image URL</label><input id="site-logo-input" class="w-full border rounded-xl p-3" value="${state.settings.siteLogoUrl||''}" placeholder="https://..."><label class="block text-sm font-semibold">bKash Merchant Number</label><input id="site-bkash-input" class="w-full border rounded-xl p-3" value="${(state.settings.paymentInfo||{}).bkash||''}"><label class="block text-sm font-semibold">Nagad Merchant Number</label><input id="site-nagad-input" class="w-full border rounded-xl p-3" value="${(state.settings.paymentInfo||{}).nagad||''}"><label class="block text-sm font-semibold">Minimum Deposit (৳)</label><input id="site-min-deposit" type="number" min="1" class="w-full border rounded-xl p-3" value="${state.settings.minDepositAmount||50}"><label class="block text-sm font-semibold">Minimum Withdrawal (৳)</label><input id="site-min-withdraw" type="number" min="1" class="w-full border rounded-xl p-3" value="${state.settings.minWithdrawAmount||100}"><hr class="my-2"><h3 class="font-bold">Gmail Sell Settings</h3><label class="block text-sm font-semibold">Price per Gmail (৳)</label><input id="gmail-price" type="number" min="0" step="0.01" class="w-full border rounded-xl p-3" value="${(state.settings.gmailSettings||{}).price||5}"><label class="block text-sm font-semibold">Daily submission limit</label><input id="gmail-limit" type="number" min="1" class="w-full border rounded-xl p-3" value="${(state.settings.gmailSettings||{}).globalLimit||200}"><button onclick="window.saveSiteSettings()" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl">Save Site Settings</button></div>`;
            },

            profile: () => {
                if (state.isGuest) return ui.authBlock();
                const d = state.data;
                return `<div class="max-w-md mx-auto fade-in">
                    <div class="glass-panel p-8 flex flex-col items-center bg-white relative mb-6">
                        <button onclick="window.enableEdit()" class="absolute top-4 right-4 text-gray-400 hover:text-indigo-600"><i class="fas fa-edit"></i></button>
                        <img src="${d.profilePictureUrl || 'https://placehold.co/100x100/4f46e5/ffffff?text='+d.username.charAt(0)}" class="w-24 h-24 rounded-full border-4 border-indigo-100 shadow-xl mb-4">
                        <h2 class="text-2xl font-bold text-gray-800" id="prof-name">${d.fullname || d.username}</h2>
                        <p class="text-gray-500 text-sm">@<span id="prof-user">${d.username}</span></p>
                        
                        <!-- Edit Form Hidden -->
                        <div id="edit-form" class="hidden w-full mt-4 space-y-3">
                            <input type="text" id="edit-fullname" value="${d.fullname||''}" class="w-full p-2 border rounded" placeholder="Full Name">
                            <input type="text" id="edit-username" value="${d.username}" class="w-full p-2 border rounded" placeholder="Username">
                            <div class="flex gap-2">
                                <button onclick="window.saveProfile()" class="flex-1 bg-indigo-600 text-white py-2 rounded">Save</button>
                                <button onclick="window.disableEdit()" class="flex-1 bg-gray-200 text-gray-700 py-2 rounded">Cancel</button>
                            </div>
                        </div>
                    </div>

                    <div class="bg-white rounded-2xl shadow-sm p-4 space-y-4">
                        <div class="flex justify-between items-center p-3 hover:bg-gray-50 rounded-lg cursor-pointer">
                            <span class="text-gray-600 font-medium"><i class="fas fa-globe mr-3 text-indigo-400"></i> Language</span>
                            <div class="flex space-x-2">
                                <button onclick="lang.set('en')" class="px-2 py-1 text-xs rounded ${state.currentLang=='en'?'bg-indigo-600 text-white':'bg-gray-100'}">EN</button>
                                <button onclick="lang.set('bn')" class="px-2 py-1 text-xs rounded ${state.currentLang=='bn'?'bg-indigo-600 text-white':'bg-gray-100'}">BN</button>
                            </div>
                        </div>
                        <div onclick="auth.signOut()" class="flex justify-between items-center p-3 hover:bg-red-50 rounded-lg cursor-pointer text-red-500">
                            <span class="font-medium"><i class="fas fa-sign-out-alt mr-3"></i> ${lang.t('logout')}</span>
                        </div>
                    </div>
                </div>`;
            }
        };

        // --- 6. BLOCKERS & HELPERS ---
        ui.authBlock = () => `<div class="text-center mt-20 fade-in"><div class="w-20 h-20 bg-indigo-50 rounded-full flex items-center justify-center mx-auto mb-4 text-indigo-500 text-2xl"><i class="fas fa-lock"></i></div><h3 class="text-xl font-bold text-gray-800">${lang.t('no_access')}</h3><p class="text-gray-500 mb-6">${lang.t('no_access_desc')}</p><button onclick="authHandler.trigger()" class="btn-primary px-8 py-3 rounded-xl font-bold shadow-lg">Login Now</button></div>`;
        
        ui.inactiveBlock = () => `<div class="text-center mt-20 fade-in"><div class="w-20 h-20 bg-red-50 rounded-full flex items-center justify-center mx-auto mb-4 text-red-500 text-2xl"><i class="fas fa-ban"></i></div><h3 class="text-xl font-bold text-gray-800">${lang.t('act_msg')}</h3><p class="text-gray-500 mb-6">${lang.t('act_desc')}</p></div>`;

        // --- 7. GLOBAL WINDOW FUNCTIONS (For HTML Onclick) ---
        window.openWithdrawModal = (method) => {
            if (!state.data.isAccountActive) return alert(lang.t('act_desc'));
            
            const content = `
                <div class="text-center">
                    <div class="w-16 h-16 bg-${method=='Bkash'?'pink':'orange'}-100 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl font-bold text-${method=='Bkash'?'pink':'orange'}-600">${method[0]}</div>
                    <h3 class="text-xl font-bold mb-4">Withdraw via ${method}</h3>
                    <form onsubmit="window.submitWithdraw(event, '${method}')" class="space-y-4 text-left">
                        <div>
                            <label class="text-xs font-bold text-gray-500 uppercase">Number</label>
                            <input type="tel" name="num" class="w-full p-3 bg-gray-50 border rounded-xl" required>
                        </div>
                        <div>
                            <label class="text-xs font-bold text-gray-500 uppercase">Amount</label>
                            <input type="number" name="amt" class="w-full p-3 bg-gray-50 border rounded-xl" required>
                        </div>
                        <button class="btn-primary w-full py-3 rounded-xl font-bold">Withdraw</button>
                    </form>
                </div>`;
            document.getElementById('gen-modal-content').innerHTML = content;
            ui.openModal('gen-modal');
        };

        window.submitWithdraw = async (e, method) => {
            e.preventDefault();
            const num = e.target.num.value;
            const amt = parseFloat(e.target.amt.value);
            
            if(amt > state.data.balance) return alert("Insufficient Balance");
            if(amt < (state.settings.minWithdrawAmount || 100)) return alert(`Min withdraw: ${state.settings.minWithdrawAmount}`);

            try {
                await db.ref('transactions').push({
                    userId: state.user.uid,
                    type: 'Withdrawal',
                    amount: -amt,
                    details: `${method} to ${num}`,
                    date: new Date().toISOString(),
                    status: 'pending'
                });
                await db.ref(`users/${state.user.uid}/balance`).set(state.data.balance - amt);
                ui.closeModal('gen-modal');
                alert("Withdrawal Requested");
            } catch(err) { alert(err.message); }
        };

        window.initPayment = (type, amount, detail) => {
            if (!state.user) return authHandler.trigger();
            const num = state.settings.paymentInfo?.bkash || "01XXX";
            const content = `
                <div class="text-center">
                    <h3 class="text-lg font-bold text-indigo-600 mb-2">${type}</h3>
                    <p class="text-2xl font-bold mb-4">${amount}৳</p>
                    <div class="bg-gray-100 p-4 rounded-xl mb-4">
                        <p class="text-xs text-gray-500">Send Money To</p>
                        <p class="text-lg font-mono font-bold select-all">${num}</p>
                    </div>
                    <form onsubmit="window.submitPayment(event, '${type}', ${amount}, '${detail||''}')" class="space-y-3">
                        <input type="text" id="trx-id" placeholder="Transaction ID" class="w-full p-3 border rounded-xl" required>
                        <button class="btn-primary w-full py-3 rounded-xl font-bold">Submit</button>
                    </form>
                </div>`;
            document.getElementById('gen-modal-content').innerHTML = content;
            ui.openModal('gen-modal');
        };

        window.submitPayment = async (e, type, amount, detail) => {
            e.preventDefault();
            const trx = document.getElementById('trx-id').value;
            await db.ref('transactions').push({
                userId: state.user.uid,
                username: state.data.username,
                type,
                amount,
                details: detail,
                trxId: trx,
                date: new Date().toISOString(),
                status: 'pending'
            });
            ui.closeModal('gen-modal');
            alert("Request Submitted");
        };

        window.runTask = async (tid, link, reward, btn) => {
            // Task Logic (Simplified for brevity)
            const date = new Date().toISOString().split('T')[0];
            btn.disabled = true;
            btn.innerHTML = '<div class="spinner border-indigo-600"></div>';
            
            const w = window.open(link, '_blank');
            if(!w) { alert("Allow Popups"); btn.disabled=false; return; }

            setTimeout(async () => {
                try {
                    await db.ref(`users/${state.user.uid}/balance`).set((state.data.balance||0) + reward);
                    // Mark complete in DB (omitted for brevity)
                    btn.innerHTML = '<i class="fas fa-check"></i>';
                    alert(`Task Complete! +${reward}৳`);
                } catch(e) { btn.disabled = false; }
            }, 5000);
        };
        
        // Profile Edit
        window.enableEdit = () => {
            document.getElementById('prof-name').classList.add('hidden');
            document.getElementById('prof-user').classList.add('hidden');
            document.getElementById('edit-form').classList.remove('hidden');
        };
        window.disableEdit = () => {
            document.getElementById('prof-name').classList.remove('hidden');
            document.getElementById('prof-user').classList.remove('hidden');
            document.getElementById('edit-form').classList.add('hidden');
        };
        window.saveProfile = async () => {
            const full = document.getElementById('edit-fullname').value;
            const user = document.getElementById('edit-username').value;
            if(!user) return alert("Username required");
            await db.ref(`users/${state.user.uid}`).update({ fullname: full, username: user });
            window.disableEdit();
        };

        window.loadDepositReview = async () => {
            const box = document.getElementById('deposit-review-list');
            if (!box || !state.isAdmin) return;
            try {
                const snap = await db.ref('transactions').orderByChild('type').equalTo('Deposit').once('value');
                const rows = Object.entries(snap.val() || {}).filter(([id,t]) => t.status === 'pending').reverse();
                if (!rows.length) { box.innerHTML = '<div class="bg-white rounded-xl p-8 text-center text-gray-500">No pending deposits.</div>'; return; }
                box.innerHTML = rows.map(([id,t]) => {
                    const shot = t.screenshotData ? '<img src="' + t.screenshotData + '" alt="Deposit payment screenshot" class="mt-4 max-h-72 rounded-xl border object-contain bg-gray-50">' : '<p class="mt-3 text-red-600 text-sm">No screenshot attached</p>';
                    return '<article class="bg-white rounded-2xl border shadow-sm p-5"><div class="flex flex-wrap justify-between gap-2"><div><h3 class="font-extrabold text-lg">৳' + Number(t.amount||0).toFixed(2) + ' · ' + (t.method||'Payment') + '</h3><p class="text-sm text-gray-500">User: ' + (t.userId||'—') + ' · TrxID: ' + (t.trxId||'—') + '</p><p class="text-xs text-gray-400">' + (t.date||'') + '</p></div><span class="text-xs rounded-full bg-amber-100 text-amber-700 px-3 py-1 h-fit">PENDING</span></div>' + shot + '<div class="flex gap-3 mt-4"><button onclick="window.reviewDeposit(\'' + id + '\',\'approve\')" class="flex-1 bg-emerald-600 text-white font-bold py-3 rounded-xl">Approve</button><button onclick="window.reviewDeposit(\'' + id + '\',\'reject\')" class="flex-1 bg-red-600 text-white font-bold py-3 rounded-xl">Reject</button></div></article>';
                }).join('');
            } catch (e) {
                box.innerHTML = '<div class="bg-red-50 text-red-700 p-5 rounded-xl">Could not load deposits. Check Firebase Database Rules.</div>';
            }
        };

        window.loadTaskReview = async () => {
            const box=document.getElementById('task-review-list');
            if (!box || !state.isAdmin) return;
            try {
                const snap=await db.ref('taskSubmissions').once('value');
                const rows=Object.entries(snap.val()||{}).filter(([id,t])=>t.status==='pending').reverse();
                if(!rows.length){box.innerHTML='<div class="bg-white rounded-xl p-8 text-center text-gray-500">No pending task screenshots.</div>';return;}
                box.innerHTML=rows.map(([id,t])=>{
                    const shot=t.screenshotData?'<img src="'+t.screenshotData+'" alt="Task proof" class="mt-4 max-h-72 rounded-xl border object-contain bg-gray-50">':'<p class="text-red-600">No screenshot</p>';
                    return '<article class="bg-white rounded-2xl border shadow-sm p-5"><div class="flex flex-wrap justify-between gap-2"><div><h3 class="font-extrabold text-lg">'+(t.taskName||'Task')+'</h3><p class="text-sm text-gray-500">User: '+(t.userId||'—')+' · Category: '+(t.category||'basic')+'</p><p class="text-sm font-bold text-emerald-600">Reward: ৳'+Number(t.reward||0).toFixed(2)+'</p><p class="text-xs text-gray-400">'+(t.date||'')+'</p></div><span class="text-xs rounded-full bg-amber-100 text-amber-700 px-3 py-1 h-fit">PENDING</span></div>'+shot+'<div class="flex gap-3 mt-4"><button onclick="window.reviewTask(\''+id+'\',\'approve\')" class="flex-1 bg-emerald-600 text-white font-bold py-3 rounded-xl">Approve</button><button onclick="window.reviewTask(\''+id+'\',\'reject\')" class="flex-1 bg-red-600 text-white font-bold py-3 rounded-xl">Reject</button></div></article>';
                }).join('');
            } catch(e){box.innerHTML='<div class="bg-red-50 text-red-700 p-5 rounded-xl">Could not load task submissions. Check Firebase Rules.</div>';}
        };

        window.reviewTask = async (id, decision) => {
            if(!state.isAdmin || !confirm((decision==='approve'?'Approve':'Reject')+' this task proof?')) return;
            const ref=db.ref('taskSubmissions/'+id);
            const lock=await ref.transaction(current=>{
                if(!current || current.status!=='pending') return;
                current.status='processing'; current.reviewedBy=state.user.uid; return current;
            });
            if(!lock.committed) return alert('This task has already been reviewed.');
            const item=lock.snapshot.val();
            if(decision==='reject'){
                await ref.update({status:'rejected',reviewedAt:new Date().toISOString()});
                alert('Task proof rejected.'); app.nav('task_review',true); return;
            }
            const userRef=db.ref('users/'+item.userId);
            const credit=await userRef.transaction(user=>{
                if(!user) return;
                user.taskCredits=user.taskCredits||{};
                if(user.taskCredits[id]) return;
                user.balance=Number(user.balance||0)+Number(item.reward||0);
                user.taskCredits[id]=true;
                user.completedTasks=user.completedTasks||{};
                user.completedTasks[item.category==='basic' ? item.taskId : ('telegram_'+item.taskId)]=true;
                user.lastTaskDate=new Date().toISOString().slice(0,10);
                return user;
            });
            if(!credit.committed){await ref.update({status:'pending'});return alert('Wallet credit failed; task returned to pending.');}
            await ref.update({status:'approved',reviewedAt:new Date().toISOString()});
            alert('Task approved and reward credited.'); app.nav('task_review',true);
        };

        window.loadTaskList = async () => {
            const box=document.getElementById('task-manage-list'); if(!box||!state.isAdmin)return;
            const snap=await db.ref('tasks').once('value'); const data=snap.val()||{};
            const rows=[];
            ['basic','telegram'].forEach(category=>Object.entries(data[category]||{}).forEach(([id,t])=>rows.push({id,category,...t})));
            box.innerHTML=rows.map(t=>'<div class="bg-white p-4 rounded-xl border flex flex-wrap items-center justify-between gap-3"><div><b>'+t.name+'</b><p class="text-sm text-gray-500">'+t.category+' · ৳'+t.reward+' · '+t.link+'</p></div><div class="flex gap-2"><button onclick="window.editTask(\''+t.id+'\',\''+t.category+'\')" class="px-3 py-2 rounded-lg bg-indigo-50 text-indigo-700">Edit</button><button onclick="window.deleteTask(\''+t.id+'\',\''+t.category+'\')" class="px-3 py-2 rounded-lg bg-red-50 text-red-700">Delete</button></div></div>').join('')||'<p class="bg-white p-5 rounded-xl">No tasks created.</p>';
        };
        window.saveTask = async event => {
            event.preventDefault(); if(!state.isAdmin)return;
            const id=document.getElementById('task-edit-id').value;
            const category=document.getElementById('task-category').value;
            const item={name:document.getElementById('task-name').value.trim(),reward:Number(document.getElementById('task-reward').value),link:document.getElementById('task-link').value.trim()};
            if(!item.name||item.reward<=0||!/^https?:\/\//i.test(item.link))return alert('Enter valid task details.');
            const ref=db.ref('tasks/'+category);
            if(id) await ref.child(id).update(item); else await ref.push(item);
            alert('Task saved.'); app.nav('task_manager',true);
        };
        window.editTask = async (id,category) => {
            const snap=await db.ref('tasks/'+category+'/'+id).once('value'); const t=snap.val(); if(!t)return;
            document.getElementById('task-edit-id').value=id; document.getElementById('task-category').value=category;
            document.getElementById('task-name').value=t.name||''; document.getElementById('task-reward').value=t.reward||'';
            document.getElementById('task-link').value=t.link||''; window.scrollTo({top:0,behavior:'smooth'});
        };
        window.deleteTask = async (id,category) => {if(!state.isAdmin||!confirm('Delete this task?'))return;await db.ref('tasks/'+category+'/'+id).remove();app.nav('task_manager',true);};

        window.loadPlanList = async () => {
            const box=document.getElementById('plan-list');
            if (!box || !state.isAdmin) return;
            const snap=await db.ref('plans').once('value');
            const plans=snap.val()||{};
            box.innerHTML=Object.entries(plans).map(([id,p]) => '<div class="bg-white p-4 rounded-xl border flex flex-wrap items-center justify-between gap-3"><div><b>' + (p.name||'Plan') + '</b><p class="text-sm text-gray-500">৳' + p.price + ' · ৳' + (p.dailyIncome||0) + '/day · ' + p.durationDays + ' days</p></div><div class="flex gap-2"><button onclick="window.editPlan(\'' + id + '\')" class="px-3 py-2 rounded-lg bg-indigo-50 text-indigo-700">Edit</button><button onclick="window.deletePlan(\'' + id + '\')" class="px-3 py-2 rounded-lg bg-red-50 text-red-700">Delete</button></div></div>').join('') || '<p class="bg-white p-5 rounded-xl">No plans created yet.</p>';
        };

        window.reviewDeposit = async (id, decision) => {
            if (!state.isAdmin || !confirm(`${decision === 'approve' ? 'Approve' : 'Reject'} this deposit?`)) return;
            const ref = db.ref(`transactions/${id}`);
            const lock = await ref.transaction(current => {
                if (!current || current.type !== 'Deposit' || current.status !== 'pending') return;
                current.status = 'processing';
                current.reviewedBy = state.user.uid;
                return current;
            });
            if (!lock.committed) return alert('This request has already been processed.');
            const item = lock.snapshot.val();
            if (decision === 'reject') {
                await ref.update({status:'rejected', reviewedAt:new Date().toISOString()});
                alert('Deposit rejected.');
                app.nav('deposit_review', true);
                return;
            }
            const userRef = db.ref(`users/${item.userId}`);
            const credit = await userRef.transaction(user => {
                if (!user) return;
                user.depositCredits = user.depositCredits || {};
                if (user.depositCredits[id]) return;
                user.balance = Number(user.balance || 0) + Number(item.amount || 0);
                user.depositCredits[id] = true;
                return user;
            });
            if (!credit.committed) {
                await ref.update({status:'pending'});
                return alert('Could not credit the wallet. Request returned to pending.');
            }
            await ref.update({status:'approved', reviewedAt:new Date().toISOString()});
            alert('Deposit approved and wallet credited.');
            app.nav('deposit_review', true);
        };

        window.savePlan = async (event) => {
            event.preventDefault();
            if (!state.isAdmin) return;
            const id=document.getElementById('plan-edit-id').value;
            const plan={name:document.getElementById('plan-name').value.trim(),price:Number(document.getElementById('plan-price').value),dailyIncome:Number(document.getElementById('plan-daily').value),durationDays:Number(document.getElementById('plan-days').value)};
            if (!plan.name || plan.price<=0 || plan.dailyIncome<=0 || plan.durationDays<1) return alert('Enter valid plan details.');
            if (id) await db.ref(`plans/${id}`).update(plan); else await db.ref('plans').push(plan);
            alert('Plan saved.'); app.nav('plan_manager',true);
        };
        window.editPlan = async (id) => {
            const snap=await db.ref(`plans/${id}`).once('value'); const p=snap.val(); if(!p) return;
            document.getElementById('plan-edit-id').value=id;
            document.getElementById('plan-name').value=p.name||'';
            document.getElementById('plan-price').value=p.price||'';
            document.getElementById('plan-daily').value=p.dailyIncome||'';
            document.getElementById('plan-days').value=p.durationDays||'';
            window.scrollTo({top:0,behavior:'smooth'});
        };
        window.deletePlan = async (id) => {
            if (!state.isAdmin || !confirm('Delete this plan?')) return;
            await db.ref(`plans/${id}`).remove(); app.nav('plan_manager',true);
        };
        window.saveSiteSettings = async () => {
            if (!state.isAdmin) return;
            const updates={
                siteName:document.getElementById('site-name-input').value.trim() || 'Cash BD',
                siteLogoUrl:document.getElementById('site-logo-input').value.trim(),
                paymentInfo:{bkash:document.getElementById('site-bkash-input').value.trim(),nagad:document.getElementById('site-nagad-input').value.trim()},
                minDepositAmount:Number(document.getElementById('site-min-deposit').value)||50,
                minWithdrawAmount:Number(document.getElementById('site-min-withdraw').value)||100
            };
            updates.gmailSettings={
                price:Number(document.getElementById('gmail-price').value)||5,
                globalLimit:Number(document.getElementById('gmail-limit').value)||200
            };
            await db.ref('admin').update(updates);
            await db.ref('admin/gmailSettings').update(updates.gmailSettings);
            state.settings={...state.settings,...updates};
            document.title=updates.siteName;
            const title=document.getElementById('sidebar-title'); if(title) title.textContent=updates.siteName;
            const logo=document.getElementById('sidebar-logo'); if(logo) logo.innerHTML=updates.siteLogoUrl ? `<img src="${updates.siteLogoUrl}" alt="Site logo" class="w-full h-full object-contain">` : '<i class="fas fa-gem"></i>';
            alert('Site settings updated.');
        };

        // Initialize App
        document.addEventListener('DOMContentLoaded', app.init);

    </script>
</body>
</html>
